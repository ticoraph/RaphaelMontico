name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"

env:
  AWS_REGION: eu-central-1

jobs:
  deploy:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOYER_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Check FR/EN translation parity
        run: node scripts/check-translation-status.js --fail-on-drift

      - name: Install & Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: npm ci && npm run build

      - name: Sync to S3
        run: |
          # Next.js build assets (content-hashed filenames) — cache forever
          aws s3 sync frontend/out/_next/ s3://${{ vars.FRONTEND_BUCKET }}/_next/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable"

          # HTML/JSON/other route output — always revalidate
          aws s3 sync frontend/out/ s3://${{ vars.FRONTEND_BUCKET }} \
            --delete \
            --exclude "_next/*" \
            --cache-control "public, max-age=0, must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DIST_ID }} \
            --paths "/*"
