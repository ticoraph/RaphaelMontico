name: CI

on:
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: backend
          POSTGRES_PASSWORD: backend
          POSTGRES_DB: backend
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U backend"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://backend:backend@localhost:5432/backend
      OPENAI_API_KEY: ci-placeholder
      ALLOWED_ORIGINS: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements-dev.txt

      - name: Lint
        run: |
          cd backend
          ruff check .

      - name: Test
        run: |
          cd backend
          pytest

  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Check FR/EN translation parity
        run: node scripts/check-translation-status.js --fail-on-drift

      - name: Install & Build
        run: |
          cd frontend
          npm ci
          npm run lint
          npm run build
        continue-on-error: true
