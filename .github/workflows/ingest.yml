name: Ingest Content

on:
  push:
    branches: [main]
    paths:
      - "frontend/content/**"
      - "backend/ingest/**"
  workflow_dispatch: {}

env:
  AWS_REGION: eu-central-1

jobs:
  ingest:
    name: Run Ingestion Pipeline
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOYER_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Load secrets from SSM
        # Same SSM parameters App Runner reads, so there is a single source of truth.
        run: |
          for name in DATABASE_URL OPENAI_API_KEY; do
            value=$(aws ssm get-parameter --name "/raphaelmontico/$name" \
              --with-decryption --query Parameter.Value --output text)
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done

      - name: Run ingestion
        run: |
          cd backend
          python -m ingest
