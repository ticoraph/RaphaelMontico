name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"

env:
  AWS_REGION: eu-central-1

jobs:
  deploy:
    name: Build & Deploy Backend
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOYER_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run DB migrations
        # Applied before the new image is deployed, so App Runner never serves
        # code that expects a schema that isn't there yet. This job runs in GH
        # Actions, not in the App Runner container, so it reads DATABASE_URL
        # from the same SSM parameter App Runner uses (the DB must be
        # network-reachable from the runner; see the infra repo).
        env:
          OPENAI_API_KEY: unused-by-migrations
        run: |
          DATABASE_URL=$(aws ssm get-parameter --name /raphaelmontico/DATABASE_URL \
            --with-decryption --query Parameter.Value --output text)
          echo "::add-mask::$DATABASE_URL"
          export DATABASE_URL
          cd backend
          pip install -r requirements.txt
          alembic upgrade head

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag and push image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY_NAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            ./backend
          docker push $ECR_REGISTRY/$ECR_REPOSITORY --all-tags

      - name: Deploy to App Runner
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY_NAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          aws apprunner update-service \
            --service-arn ${{ vars.APPRUNNER_SERVICE_ARN }} \
            --source-configuration '{
              "ImageRepository": {
                "ImageIdentifier": "'"$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"'",
                "ImageRepositoryType": "ECR",
                "ImageConfiguration": {
                  "Port": "8080",
                  "RuntimeEnvironmentVariables": {
                    "ALLOWED_ORIGINS": "https://raphaelmontico.fr,https://www.raphaelmontico.fr",
                    "LANGFUSE_BASE_URL": "https://cloud.langfuse.com",
                    "LLM_PROVIDER": "openai",
                    "PORT": "8080"
                  },
                  "RuntimeEnvironmentSecrets": {
                    "DATABASE_URL": "arn:aws:ssm:'"$AWS_REGION"':'"$ACCOUNT_ID"':parameter/raphaelmontico/DATABASE_URL",
                    "OPENAI_API_KEY": "arn:aws:ssm:'"$AWS_REGION"':'"$ACCOUNT_ID"':parameter/raphaelmontico/OPENAI_API_KEY",
                    "LANGFUSE_PUBLIC_KEY": "arn:aws:ssm:'"$AWS_REGION"':'"$ACCOUNT_ID"':parameter/raphaelmontico/LANGFUSE_PUBLIC_KEY",
                    "LANGFUSE_SECRET_KEY": "arn:aws:ssm:'"$AWS_REGION"':'"$ACCOUNT_ID"':parameter/raphaelmontico/LANGFUSE_SECRET_KEY"
                  }
                }
              },
              "AuthenticationConfiguration": {
                "AccessRoleArn": "'"${{ vars.APPRUNNER_ECR_ROLE_ARN }}"'"
              }
            }'

      - name: Wait for deployment
        run: |
          echo "Deployment initiated. App Runner will update the service."
          echo "Monitor at: https://${{ env.AWS_REGION }}.console.aws.amazon.com/apprunner"
